# Snakemake DRIVER environment (NOT created by run.sh): activate it before running.
#
# Authoritative `conda env export` of the deployment machine's driver env:
# 191 pins, including Snakemake 7.32.4, pulp 2.7.0 and Python 3.11.16.
# Create it elsewhere with:  mamba env create -f envs/snakemake.yml
#
# Two lines from the raw export were removed for portability: the `prefix:` line
# (it stored the exporting machine's install path, so `conda env create -f` would
# target that path elsewhere) and the `ursky` channel (verified unused by this
# file: none of its 191 dependencies is hosted there; the same check removed it
# from envs/drep.yml, and it is genuinely required only by envs/metawrap-env.yml).
# The remaining channels (bioconda, conda-forge, defaults, r) are inherited from
# the exporting machine's condarc.
