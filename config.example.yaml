# Pipeline configuration (annotated template).
#
# Copy this file to `config.yaml` and fill the 12 machine-specific paths below
# before running:  cp config.example.yaml config.yaml
# `config.yaml` ships with the same placeholders and comments, so the two are
# interchangeable; keep them in sync when either changes.
#
# Paths to fill (12):
#   1  data_dir                     raw paired-end reads ({sample}_1.fq.gz / _2.fq.gz)
#   2  tmpdir                       scratch space (honoured via $TMPDIR, MEGAHIT/SPAdes --tmp-dir)
#   3  fastq_screen_conf.control
#   4  fastq_screen_conf.exp
#   5  bowtie2_index.control
#   6  bowtie2_index.exp
#   7  coverm_ref.control
#   8  coverm_ref.exp
#   9  software.fastq_screen
#   10 software.spades
#   11 gtdbtk_data
#   12 checkm_data
# plus metawrap.local_base (short, node-local scratch; see its comment below).
data_dir: "/path/to/raw/data"
tmpdir: "/path/to/tmp"

filter_methods:
  - bt2
  - coverm
  - fastqs

assembly_treats:
  - control_assemble
  - PCR_assemble

binners:
  - unitem
  - comebin
  - metadecoder
  - semibin2_single
  - metawrap

# Assembly treatments the metaWRAP arm runs. This is a SUBSET of
# `assembly_treats`; the Snakefile asserts `metawrap_treats <= assembly_treats`.
# Remove the key entirely to run the metaWRAP arm on every assembly treatment.
metawrap_treats:
  - control_assemble
  - PCR_assemble

groups:
  - control
  - exp

# dRep layer. `mimag` holds the MAG quality cutoffs and `drep` the ones handed
# to dRep's own filter; the two must match (asserted in rules/drep.smk).
mimag:
  min_completeness: 50   # Bowers 2017 Nat Biotechnol PMID 28787424 (MIMAG medium-quality >= 50%)
  max_contamination: 10  # same source; dRep compares with <=, so the paper text reads "<= 10%"
drep:
  min_completion: 50     # must equal mimag.min_completeness (asserted in rules/drep.smk)
  max_contamination: 10  # must equal mimag.max_contamination (same assertion)
  min_length: 0          # 0 disables the length filter (d_filter_wrapper only applies it when length > 1)
  p_ani: 0.90            # primary (MASH) ANI threshold, dRep 3.6.2 default
  s_ani: 0.95            # secondary ANI threshold (~95% ANI; PMID 19855009, 30504855)
  cov_thresh: 0.1        # minimum aligned coverage for secondary comparisons, dRep 3.6.2 default
  s_algorithm: fastANI   # passed explicitly; dRep 3.6.2 argparse default is fastANI (help text is stale)

# metaWRAP arm (the 5th binner). The guard is an external wrapper script that
# runs metaWRAP's binning + bin_refinement + reassemble_bins and stages the
# final bins under <base_final>/<sample>/04_FINAL_BINS_FOR_GTDB.
# The MAG quality cutoffs handed to the guard are taken from `mimag`
# (min_completeness / max_contamination) so the internal metaWRAP preselection
# and the MIMAG gate cannot drift apart.
metawrap:
  env: metawrap-env               # named conda env (pre-created; run.sh reuses it)
  # REQUIRED when `metawrap` is in `binners`. `guard` is a path RELATIVE to the
  # repository root (resolved against workflow.basedir by rules/metawrap.smk);
  # `rules/metawrap.smk` aborts at parse time (included at Snakefile parse time)
  # while `guard`/`local_base` are empty, the guard file is missing/unreadable, or
  # its md5 does not equal `guard_md5` (fail fast, rather than a runtime bash error).
  guard: "tools/mw_guard.sh"      # relative to the repository root
  guard_version: "1.1"            # documentation only; identity is enforced by guard_md5
  guard_md5: "50e6127e06deebd82c751e8ce575e0ab"  # md5 of the frozen v1.1 guard
  # REQUIRED: a SHORT, NODE-LOCAL scratch dir (not a network FS). metaWRAP's
  # bundled CheckM uses AF_UNIX sockets, whose path is capped at 107 bytes
  # (UNIX_PATH_MAX=108); a long path makes it die silently. The guard rejects a
  # network filesystem outright (ALLOW_NETWORK_WORK=0). Example: /tmp/$USER/mw
  local_base: "/path/to/node-local/scratch"
  refine_mem_gb: 40               # metaWRAP bin_refinement -m
  reassemble_mem_gb: 40           # metaWRAP reassemble_bins -m
  keep_short_work: 0
  archive_existing: 0

fastq_screen_conf:
  control: "/path/to/control.conf"
  exp: "/path/to/exp.conf"

bowtie2_index:
  control: "/path/to/control/control"
  exp: "/path/to/exp/exp"

coverm_ref:
  control: "/path/to/control.fna"
  exp: "/path/to/exp/ref_Acropora_allSymb_comb.fa"

# External (non-conda) tools, absolute paths
software:
  fastq_screen: "/path/to/FastQ-Screen-0.14.1/fastq_screen"
  spades: "/path/to/spades/bin/spades.py"

# GTDB-Tk reference database directory (assigned to GTDBTK_DATA_PATH)
gtdbtk_data: "/path/to/gtdb/releaseXXX"

# CheckM reference data root (assigned to CHECKM_DATA_PATH). Must already be
# populated by `checkm data setRoot <dir>` (or equivalent); it is not shipped in
# any conda environment.
checkm_data: "/path/to/checkm/data"

# NOTE: Kaiju is disabled (not a target of `rule all`; its rule is commented out
# in rules/preprocess.smk). The former `kaiju:` DB paths and `threads.kaiju` were
# removed so no orphan config keys remain; see the README for why it is disabled
# and how to reinstate it (with the original paths) if needed.

threads:
  fastq_screen: 16
  fastp: 16
  bowtie2_map: 32
  bowtie2_filter: 16
  bam_to_fastq: 30
  coverm: 60
  megahit: 60
  bt2_build_contigs: 10
  remap_contigs: 40
  pcr_dedup: 40
  spades_control: 48
  spades_pcr: 64
  remap_final_contigs: 48
  unitem: 64
  comebin: 96
  metadecoder_cov: 64
  metadecoder_seed: 64
  metadecoder_cluster: 20
  semibin: 64
  refinem: 64
  checkm: 96
  checkm_qa: 8   # `checkm qa` only re-parses existing HMMER output; keep it light so many can run at once
  gtdbtk: 64
  metawrap: 32   # passed to the guard via THREADS. Conservative default: only a tiny fixture has been timed, no real-scale single-combo timing run yet.
  drep_pw: 8     # per-workflow pools are small; many can run concurrently
  drep_xw: 36    # the single cross-workflow job is large

# Memory declarations for the dRep and metaWRAP rules.
resources:
  drep_pw_mem_mb: 16000
  metawrap_mem_mb: 64000  # scheduling declaration only; replace with ~1.5x the observed peak after a real-scale single-combo timing run
  checkm_qa_mem_mb: 8000  # `checkm qa` re-parses existing output; far below a full lineage_wf
  drep_xw_mem_mb: 64000
  gtdbtk_mem_mb: 200000   # pplacer is accounted as PARENT x (1 + pplacer_cpus): ~2 x 55-61 GB for the
                          # pinned ref data (r207/r214), ~2 x 140 GB with current data
